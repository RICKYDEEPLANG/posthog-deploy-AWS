global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'containers'
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'system'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'caddy'
    static_configs:
      - targets: ['proxy:2019']

  - job_name: 'capture'
    static_configs:
      - targets: ['capture:3000']
    metrics_path: '/metrics'
